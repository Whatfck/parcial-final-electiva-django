{% load static %}
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sistema de Reservas{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/styles.css' %}">
</head>
<body>
    <div class="page-shell">
        <header class="site-header">
            <div>
                <p class="eyebrow">Parcial final electiva Django</p>
                <h1>Sistema de Gestión de Reservas</h1>
            </div>
            <nav class="site-nav">
                <a href="{% url 'home' %}">Inicio</a>
                {% if request.user.is_authenticated %}
                    <a href="{% url 'reservas:lista' %}">Reservas</a>
                    <span class="user-chip">{{ request.user.username }}</span>
                    <form action="{% url 'accounts:logout' %}" method="post" class="inline-form">
                        {% csrf_token %}
                        <button type="submit" class="link-button">Salir</button>
                    </form>
                {% else %}
                    <a href="{% url 'accounts:login' %}">Ingresar</a>
                {% endif %}
            </nav>
        </header>

        <main class="content-grid">
            {% block content %}{% endblock %}
        </main>
    </div>
</body>
</html>
